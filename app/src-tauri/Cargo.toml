[package]
name = "nimbus"
description = "Nimbus: a utility island for the top of your screen, with an AI harness"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "nimbus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nimbus-system = { path = "../../crates/system" }
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2.7"
arboard = "3.6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif"] }
rayon = "1"
memchr = "2"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
ureq = "3.4"
xcap = "0.9"
cpal = "0.16"
enigo = "0.6"
base64 = "0.22"
ring = "0.17"
open = "5"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
mail-parser = "0.11"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
sysinfo = "0.39"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem", "Win32_UI_Accessibility", "Win32_System_Com", "Win32_System_Variant", "Win32_System_Ole"] }
